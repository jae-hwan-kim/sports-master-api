# docker-compose.yml
services:
  db:
    image: postgres:16
    container_name: sports-master-db
    environment:
      POSTGRES_DB: sports_master
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: